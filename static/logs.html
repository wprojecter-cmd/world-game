<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Game — Server Logs</title>
<style>
:root{color-scheme:dark;--bg:#090d12;--panel:#111821;--line:#273442;--muted:#8fa1b4;--text:#e8f0f8;--green:#70e1a1;--red:#ff7474;--yellow:#ffd36e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,sans-serif}header{position:sticky;top:0;background:#0b1119f2;border-bottom:1px solid var(--line);padding:18px max(16px,calc((100vw - 1400px)/2));z-index:2;backdrop-filter:blur(12px)}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--muted)}main{max-width:1400px;margin:auto;padding:18px 16px}.toolbar,.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}button,select,input{font:inherit;color:var(--text);background:#0c131c;border:1px solid #344556;border-radius:8px;padding:9px 11px}button{cursor:pointer}button.primary{background:#155b3a;border-color:#26734d}button:hover{filter:brightness(1.15)}input[type=search]{flex:1;min-width:220px}.status{color:var(--muted);margin-left:auto}.error{color:var(--red)}.log{border-bottom:1px solid #24303b;padding:12px 4px;display:grid;grid-template-columns:180px 84px minmax(0,1fr) 72px;gap:12px;align-items:start}.log:last-child{border:0}.time,.meta{color:var(--muted);font:12px ui-monospace,Consolas,monospace}.level{font-weight:700;text-transform:uppercase;font-size:11px}.level.error,.level.critical,.level.emergency{color:var(--red)}.level.warning,.level.alert{color:var(--yellow)}.level.info{color:var(--green)}.message{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,Consolas,monospace}.message mark{background:#705821;color:#fff}.empty{padding:40px 10px;text-align:center;color:var(--muted)}.small{font-size:12px;color:var(--muted)}@media(max-width:720px){.log{grid-template-columns:1fr 1fr;gap:4px}.message{grid-column:1/-1}.copyline{grid-column:2;justify-self:end}.status{width:100%;margin:0}}
</style></head><body><header><h1>World Game / Server Logs</h1><p>Настоящие runtime-, request- и build-логи Render через защищённый серверный API.</p></header>
<main><div class="panel"><div class="toolbar"><button id="refresh" class="primary">↻ Обновить</button><button id="copy">Копировать отфильтрованные</button><button id="auto">Автообновление: выкл.</button><span id="status" class="status">Ожидание</span></div>
<div class="filters"><label>Период <select id="hours"><option value="1">Последний час</option><option value="3">3 часа</option><option value="6">6 часов</option><option value="24" selected>24 часа</option><option value="168">7 дней</option></select></label><label>Тип <select id="type"><option value="app">Приложение</option><option value="request">HTTP-запросы</option><option value="build">Сборка</option></select></label><label>Уровень <select id="level"><option value="">Все уровни</option><option value="error">Ошибки</option><option value="warning">Предупреждения</option><option value="info">Информация</option><option value="debug">Отладка</option><option value="critical">Critical</option></select></label><input id="search" type="search" placeholder="Поиск: Traceback, 502, MongoDB, /api/roads…"><button id="clear">Сбросить</button></div><div class="small">Доступ ограничивается сервером. API-ключ Render не отправляется в браузер.</div></div>
<div class="panel"><div id="summary" class="small">Логи ещё не загружены.</div><div id="logs"><div class="empty">Нажми «Обновить», чтобы получить логи Render.</div></div></div></main>
<script>
const $=id=>document.getElementById(id);let rawLogs=[],timer=null;
function token(){return localStorage.getItem('wg_token')||''}
function label(entry,name){return (entry.labels||[]).find(x=>x.name===name)?.value||''}
function level(entry){return (label(entry,'level')||(/traceback|exception|\berror\b|failed|rejected|\b502\b|\b500\b/i.test(entry.message||'')?'error':'info')).toLowerCase()}
function filtered(){const q=$('search').value.trim().toLowerCase(),lev=$('level').value;return rawLogs.filter(x=>(!lev||level(x)===lev)&&(!q||((x.message||'')+' '+JSON.stringify(x.labels||[])).toLowerCase().includes(q)))}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const rows=filtered();$('summary').textContent=rows.length+' из '+rawLogs.length+' записей · '+(rawLogs.length?'последняя загрузка '+new Date().toLocaleTimeString():'');if(!rows.length){$('logs').innerHTML='<div class="empty">Нет записей, соответствующих фильтрам.</div>';return}
$('logs').innerHTML=rows.map((x,i)=>{const lv=level(x),ts=x.timestamp?new Date(x.timestamp).toLocaleString():'время неизвестно',msg=x.message||JSON.stringify(x),needle=$('search').value.trim();let m=safe(msg);if(needle&&needle.length<100){const esc=needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{m=m.replace(new RegExp('('+esc+')','ig'),'<mark>$1</mark>')}catch{}}return '<article class="log"><div class="time">'+safe(ts)+'</div><div class="level '+safe(lv)+'">'+safe(lv)+'</div><div class="message">'+m+'<div class="meta">'+safe(label(x,'method')+' '+label(x,'path')+' '+label(x,'statusCode')+' '+label(x,'instance'))+'</div></div><button class="copyline" data-copy="'+i+'">Копировать</button></article>'}).join('')}
async function load(){if(!token()){$('status').textContent='Нужно войти в игру';$('status').className='status error';$('logs').innerHTML='<div class="empty">Войди в World Game в этой вкладке, затем обнови /logs.</div>';return}
$('refresh').disabled=true;$('status').textContent='Загрузка…';$('status').className='status';
const p=new URLSearchParams({hours:$('hours').value,limit:'100',type:$('type').value});if($('search').value.trim())p.set('text_filter',$('search').value.trim());if($('level').value)p.set('level',$('level').value);
try{const r=await fetch('/api/render-logs?'+p,{headers:{Authorization:'Bearer '+token()}});const data=await r.json();if(!r.ok)throw Error(data.detail||'HTTP '+r.status);rawLogs=data.logs||[];$('status').textContent='Загружено · '+new Date().toLocaleTimeString();render()}catch(e){$('status').textContent='Ошибка загрузки';$('status').className='status error';$('logs').innerHTML='<div class="empty error">'+safe(e.message)+'<br><br>Проверь RENDER_API_KEY, RENDER_OWNER_ID, RENDER_SERVICE_ID и RENDER_LOGS_ALLOWED_USERS в Render.</div>'}finally{$('refresh').disabled=false}}
$('refresh').onclick=load;$('copy').onclick=async()=>{const text=filtered().map(x=>'['+(x.timestamp||'')+'] ['+level(x)+'] '+(x.message||'')+' '+JSON.stringify(x.labels||[])).join('\n');try{await navigator.clipboard.writeText(text);$('status').textContent='Скопировано '+filtered().length+' строк'}catch{$('status').textContent='Не удалось скопировать — проверь разрешения браузера'}};
$('logs').onclick=async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const row=filtered()[Number(b.dataset.copy)];if(row)try{await navigator.clipboard.writeText('['+(row.timestamp||'')+'] ['+level(row)+'] '+(row.message||'')+' '+JSON.stringify(row.labels||[]));b.textContent='Скопировано';setTimeout(()=>b.textContent='Копировать',1200)}catch{}};
$('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('auto').textContent='Автообновление: выкл.'}else{timer=setInterval(load,15000);$('auto').textContent='Автообновление: 15 сек.';load()}};
['hours','type','level'].forEach(id=>$(id).addEventListener('change',load));$('search').addEventListener('input',render);$('clear').onclick=()=>{$('search').value='';$('level').value='';render()};load();
</script></body></html>
